<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rayn — Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;

      background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.5)),
        url("https://qu.ax/Uc1VW");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      transition: background-image .5s ease;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
      color: white;
    }

    .profile-img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.85);
      box-shadow: 0 5px 25px rgba(0,0,0,.4);
      margin-bottom: 15px;
    }

    .username {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .caption {
      font-size: 14px;
      opacity: .9;
      margin-bottom: 25px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;

      color: white;
      text-decoration: none;
      font-weight: bold;

      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.25);
      backdrop-filter: blur(12px);

      border-radius: 15px;
      transition: .25s;
    }

    .link:hover {
      transform: scale(1.03);
      background: rgba(255,255,255,.25);
    }

    .icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 7px;
    }

    .link span {
      flex: 1;
      text-align: center;
      margin-right: 28px;
    }

    .music {
      margin-top: 22px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
    }

    .music-title {
      font-size: 13px;
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
      height: 35px;
    }

    .switch {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .switch button {
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.15);
      color: white;
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .switch button:hover {
      background: rgba(255,255,255,.3);
    }

    footer {
      margin-top: 20px;
      font-size: 11px;
      opacity: .65;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- PROFILE -->
    <img
      class="profile-img"
      src="https://qu.ax/InQrY"
      alt="Rayn"
    >

    <div class="username">Rayn</div>

    <div class="caption">
      Praktik · respon cepat · 7/24 jam on
    </div>

    <!-- MENU -->
    <div class="links">

      <!-- INSTAGRAM -->
      <a
        class="link"
        href="https://www.instagram.com/ray_n440?igsh=a3d5cHBvNGIydDUw"
        target="_blank"
      >
        <img
          class="icon"
          src="https://qu.ax/0cLNm"
          alt="Instagram"
        >
        <span>Instagram</span>
      </a>

      <!-- WA GROUP V1 -->
      <a
        class="link"
        href="https://chat.whatsapp.com/JscXfKR42axCLkVGZSZA7L?s=cl&p=a&ilr=4"
        target="_blank"
      >
        <img
          class="icon"
          src="https://qu.ax/l8Txa"
          alt="WhatsApp"
        >
        <span>WhatsApp Group V1</span>
      </a>

      <!-- WA GROUP V2 -->
      <a
        class="link"
        href="https://chat.whatsapp.com/HdZWfUjZ39PB7kXIHa8Hen?s=cl&p=a&ilr=4"
        target="_blank"
      >
        <img
          class="icon"
          src="https://qu.ax/QyXcn"
          alt="WhatsApp"
        >
        <span>WhatsApp Group V2</span>
      </a>

      <!-- WA CHANNEL -->
      <a
        class="link"
        href="https://whatsapp.com/channel/0029VbDA5xL2kNFl9dDEqm20"
        target="_blank"
      >
        <img
          class="icon"
          src="https://qu.ax/l8Txa"
          alt="WhatsApp Channel"
        >
        <span>Saluran WhatsApp</span>
      </a>

    </div>

    <!-- MUSIC -->
    <div class="music">
      <div class="music-title">🎵 Music — Rayn</div>

      <audio id="music" controls loop>
        <source
          src="https://qu.ax/UeVeS"
          type="audio/mpeg"
        >
        Browser kamu tidak mendukung audio.
      </audio>
    </div>

    <!-- BACKGROUND SWITCH -->
    <div class="switch">
      <button onclick="bgV1()">BG V1</button>
      <button onclick="bgV2()">BG V2</button>
    </div>

    <footer>
      © 2026 Rayn
    </footer>

  </div>

  <script>
    const bgV1Url = "https://qu.ax/Uc1VW";
    const bgV2Url = "https://qu.ax/McB3m";

    function bgV1() {
      document.body.style.backgroundImage =
        `linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.5)),
         url("${bgV1Url}")`;
    }

    function bgV2() {
      document.body.style.backgroundImage =
        `linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.5)),
         url("${bgV2Url}")`;
    }
  </script>

</body>
</html>
